project_name: "ha-addons"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Parked", "Done"]
# Folded scalars, not one long line: .yamllint caps lines at 120 and ignores only
# .git/, so this file is linted by the repo's own gate. Each entry still resolves
# to a single runnable command.
definition_of_done:
  - "just check"
  - >-
    Fast subset while iterating (not the gate):
    just fmt-check && just lint && just gen-check && just test-repo
# Backlog.md has no custom fields, and milestones are already the wave, so the
# `unit:` labels are how a task says which of the three work units owns it. They
# are a declared vocabulary, not a constraint: the CLI accepts any label, so a
# typo lands silently. Deliberately no unit:grafana-sm - both Synthetic
# Monitoring variants are generated and belong to unit:sm-shared.
labels:
  - "unit:alloy"
  - "unit:grafana-pdc"
  - "unit:sm-shared"
  - "unit:repo"
  - "needs-triage"
date_format: yyyy-mm-dd
max_column_width: 20
auto_open_browser: true
default_port: 6420
remote_operations: false
auto_commit: false
filesystem_only: false
zero_padded_ids: 4
bypass_git_hooks: false
check_active_branches: false
active_branch_days: 30
task_prefix: "hab"
