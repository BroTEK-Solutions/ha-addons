project_name: "ha-addons"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Parked", "Done"]
# Folded scalars, not one long line: .yamllint caps lines at 120 and ignores only
# .git/, so this file is linted by the repo's own gate. Each entry still resolves
# to a single runnable command.
definition_of_done:
  - "yamllint --strict ."
  - >-
    python3 tests/app_metadata_contract_test.py &&
    python3 tests/app_version_changed_test.py &&
    python3 tests/renovate_config_contract_test.py &&
    python3 tests/repository_workflow_contract_test.py &&
    python3 tests/synthetic_monitoring_variants_test.py
  - >-
    shellcheck over the file list in builder.yaml's ShellCheck step
    (only if a shell script changed)
  - >-
    ALLOY only: python3 alloy/tests/config-schema.test.py &&
    python3 alloy/tests/image-contract.test.py &&
    bash alloy/tests/generate-config.test.sh &&
    node alloy/tests/ui-static.test.mjs &&
    (cd alloy/ui && go test ./...)
  - >-
    PDC only: python3 grafana_pdc/tests/config-schema.test.py &&
    python3 grafana_pdc/tests/image-contract.test.py
  - >-
    SM only: python3 scripts/sync_synthetic_monitoring_variants.py &&
    (cd synthetic_monitoring_shared/launcher && go test ./...)
labels: []
date_format: yyyy-mm-dd
max_column_width: 20
auto_open_browser: true
default_port: 6420
remote_operations: false
auto_commit: false
filesystem_only: false
zero_padded_ids: 4
bypass_git_hooks: false
check_active_branches: false
active_branch_days: 30
task_prefix: "hab"
