name: Grafana Synthetic Monitoring Probe with Browser Checks
version: 1.1.0 # x-release-please-version
slug: grafana_sm_browser
description: >-
  Run a browser-capable private Grafana Cloud Synthetic Monitoring probe from Home Assistant.
url: https://github.com/BroTEK-Solutions/ha-addons/tree/main/grafana_sm_browser
image: ghcr.io/brotek-solutions/app-grafana-sm-browser
arch:
  - aarch64
  - amd64
init: false
privileged:
  - NET_RAW
# Optional: when Home Assistant has an MQTT broker, the probe publishes whether
# it is running and connected to Grafana Cloud as entities. "want" rather than
# "need" - the probe runs perfectly well without a broker.
services:
  - mqtt:want
tmpfs: true
options:
  log_level: info
  allow_private_networks: false
  disable_usage_reports: false
schema:
  api_token: password(1,)
  api_server_address: >-
    match(^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)*:[1-9][0-9]{0,4}$)
  log_level: list(warn|info|debug)
  allow_private_networks: bool
  disable_usage_reports: bool
