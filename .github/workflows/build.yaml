name: Build add-on

# The add-on image is built by home-assistant/builder rather than the shared
# container-publish reusable: HA needs a per-arch BUILD_FROM (the s6-overlay base
# image these service scripts depend on) and an image tag matching `version:` in
# alloy/config.yaml, neither of which that reusable can express.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Home Assistant add-on lint
        # Validates config.yaml and build.yaml against the add-on JSON schemas:
        # unknown keys, keys set to their default, and obsolete options. Not
        # community mode - this is not a Community Add-ons repository, so
        # extensions like `codeowners` are correctly rejected.
        uses: frenck/action-addon-linter@f995494fd84fae6310d23617e66d0e37de4f14eb # v2.21.0
        with:
          path: "./alloy"

      - name: ShellCheck
        # The s6 service scripts run under `with-contenv bashio`, a shebang
        # ShellCheck cannot resolve; each carries a `# shellcheck shell=bash`
        # directive instead, so no -s flag is needed here.
        run: |
          shellcheck \
            alloy/rootfs/usr/share/alloy/generate-config.sh \
            alloy/rootfs/etc/s6-overlay/s6-rc.d/init-alloy/run \
            alloy/rootfs/etc/s6-overlay/s6-rc.d/alloy/run \
            alloy/rootfs/etc/s6-overlay/s6-rc.d/alloy/finish \
            alloy/tests/generate-config.test.sh \
            alloy/tests/init-alloy.test.sh

      - name: Add-on options and schema tests
        # Catches the schema mistakes Supervisor would only surface on a user's
        # Home Assistant, including a default that silently makes an option
        # required, and any option missing from translations/en.yaml.
        run: |
          python3 -m pip install --quiet voluptuous pyyaml
          python3 alloy/tests/config-schema.test.py

      - name: Generator tests
        # Docker is present on the runner, so this also runs the `alloy fmt` /
        # `alloy run` validation that is skipped in environments without it.
        run: bash alloy/tests/generate-config.test.sh

      - name: init-alloy service tests
        # Run inside the real add-on base image: the service script needs bashio,
        # which is not on the runner, and this exercises the same bashio the
        # add-on ships with rather than a stand-in.
        run: |
          docker run --rm -v "${PWD}:/w" -w /w \
            ghcr.io/home-assistant/amd64-base-debian:bookworm \
            bash alloy/tests/init-alloy.test.sh

  build:
    name: Build ${{ matrix.arch }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, amd64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        # Pull requests build only (--test below), so no credentials are needed.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build add-on
        # The image name and version come from alloy/config.yaml (`image:` and
        # `version:`), so this workflow has no second copy of either to drift.
        #
        # The ref below is load-bearing beyond pinning: the action derives its
        # builder image tag from the ref it was checked out at, i.e. it pulls
        # ghcr.io/home-assistant/{arch}-builder:<this-ref>. Only refs that have a
        # published builder image work. The newest release, 2026.06.0, has no
        # builder image at all, so it fails with "manifest unknown"; 2026.03.2 is
        # the newest that does, and its commit SHA is published as an image tag,
        # which is what lets this stay hash-pinned. Verify any bump against
        # ghcr.io/home-assistant/amd64-builder before merging it.
        uses: home-assistant/builder@62a1597b84b3461abad9816d9cd92862a2b542c3 # 2026.03.2
        with:
          args: |
            --${{ matrix.arch }} \
            --target /data/alloy \
            ${{ github.event_name == 'pull_request' && '--test' || '' }} \
            --addon
