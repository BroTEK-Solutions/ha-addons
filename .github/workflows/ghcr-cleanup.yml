# Weekly GHCR retention for the addon images.
#
# Every published addon version must survive forever: Home Assistant lets a user
# pin or roll back to an older addon version, and config.yaml points at the
# merged multi-arch package (ghcr.io/brotek-solutions/app-<slug>). The reusable's
# default protected-tags regex '^(latest|main|v?[0-9.]+)$' already covers the
# semver tags this repo publishes, so the release history is untouched.
#
# What this sweeps here is the orphan tier: cosign 'sha256-<digest>' signature
# tags and attestation manifests whose subject digest is already gone. The
# buildcache, edge and dev-chart passes match nothing in this repo -- it
# publishes neither main-<sha> nor 0.0.0-main.* tags -- and are harmless.
#
# The per-arch packages (amd64-app-*, aarch64-app-*) are listed deliberately.
# They are SEPARATE packages, not children of the merged index, so the action
# cannot reach them via the merged package and they would otherwise never be
# swept at all. amd64-addon-alloy/aarch64-addon-alloy are the pre-rename
# (addon- -> app-) strays, still linked to this repo; both carry protected
# semver tags so nothing of theirs is deletable, but they join the orphan sweep.
name: ghcr-cleanup

on:
  schedule:
    - cron: "55 3 * * 1"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Report what would be deleted without deleting it."
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Never cancel a retention sweep halfway through; serialize overlapping runs.
  group: ghcr-cleanup
  cancel-in-progress: false

jobs:
  prune:
    permissions:
      contents: read
      packages: write # delete package versions
    uses: rknightion/.github/.github/workflows/ghcr-cleanup.yml@e6d074e42fed0c74b1e9936637b7e2fb21403779 # v1.22.0
    with:
      packages: "app-alloy,amd64-addon-alloy,aarch64-addon-alloy,amd64-app-alloy,aarch64-app-alloy,app-grafana-pdc,amd64-app-grafana-pdc,aarch64-app-grafana-pdc,app-grafana-sm,amd64-app-grafana-sm,aarch64-app-grafana-sm,app-grafana-sm-browser,amd64-app-grafana-sm-browser,aarch64-app-grafana-sm-browser"
      # Scheduled runs prune for real; a manual dispatch defaults to dry-run.
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || false }}
