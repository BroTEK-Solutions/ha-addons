name: Security and workflow lint

# Calls the shared rknightion reusables so this repo inherits fleet-wide policy
# instead of carrying its own copies. Reusables are pinned to a release SHA, as the
# fleet requires (zizmor fails a reintroduced floating @main).

on:
  workflow_call:
  schedule:
    # Weekly, so newly disclosed CVEs in the add-on image surface without a push.
    - cron: "42 5 * * 2"
  workflow_dispatch:

permissions: {}

jobs:
  # Workflow correctness, including ShellCheck over the embedded `run:` blocks.
  actionlint:
    permissions:
      contents: read
    uses: rknightion/.github/.github/workflows/actionlint.yml@79a72d215e806c12876526ff30fbd524250e1bf9 # v1.17.1

  # Actions security audit: unpinned refs, over-broad permissions, credential
  # persistence. Guards against regressing the App build hardening.
  zizmor:
    permissions:
      contents: read
      security-events: write # Required to upload zizmor SARIF findings.
      actions: read # Required to read workflow metadata during the audit.
    uses: rknightion/.github/.github/workflows/zizmor.yml@79a72d215e806c12876526ff30fbd524250e1bf9 # v1.17.1

  # hadolint + Trivy recursively cover both App Dockerfiles and their filesystems.
  # Fork PRs cannot be granted security-events: write, so their SARIF upload would
  # fail. Trusted same-repository PRs still run the complete pre-merge scan.
  docker-security:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      security-events: write # Required to upload Docker scan SARIF findings.
    uses: rknightion/.github/.github/workflows/docker-security.yml@79a72d215e806c12876526ff30fbd524250e1bf9 # v1.17.1
