# yamllint disable rule:line-length
name: Build Apps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

env:
  MONITORED_FILES: "config.json config.yaml config.yml Dockerfile launcher reporter ui rootfs apparmor.txt"

concurrency:
  group: build-apps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Repository quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.7'

      # -x follows the `# shellcheck source=` directives into the shared
      # validator library, and --source-path=SCRIPTDIR is what makes them
      # resolve: without it those paths are read relative to the working
      # directory rather than the sourcing script, every one misses, and
      # SC1091 fails the step at info level.
      - name: Lint repository
        run: just lint </dev/null

      - name: Lint Alloy App metadata
        uses: frenck/action-addon-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
        with:
          path: "./alloy"

      - name: Lint Grafana PDC App metadata
        uses: frenck/action-addon-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
        with:
          path: "./grafana_pdc"

      - name: Lint Grafana Synthetic Monitoring App metadata
        uses: frenck/action-addon-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
        with:
          path: "./grafana_sm"

      - name: Lint Grafana Synthetic Monitoring browser App metadata
        uses: frenck/action-addon-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
        with:
          path: "./grafana_sm_browser"

      - name: Check generated copies
        run: just gen-check </dev/null

      - name: Set up Go for the shared MQTT reporter
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: shared/reporter/go.mod
          cache: true

      - name: Check formatting
        run: just fmt-check </dev/null

      - name: Run repository tests
        run: just test-repo </dev/null

  pdc-test:
    name: Grafana PDC tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.7'

      - name: Set up Go for the PDC status page
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: grafana_pdc/ui/go.mod
          cache: true

      - name: Run PDC toolchain tests
        run: just test-pdc </dev/null

      # Same pair as the other cached lanes. PDC was left uncached while it was
      # off the critical path; it is now joint-slowest, so the uncached image
      # build in the step below is worth removing.
      - name: Expose the Actions cache service to BuildKit
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Set up a cache-capable Docker builder
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Run PDC Docker tests
        run: just test-pdc-image </dev/null

  alloy-generator-test:
    name: Alloy schema and generator tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.7'

      - name: Set up Go for the ingress UI
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: alloy/ui/go.mod
          cache: true

      - name: Run Alloy toolchain tests
        run: just test-alloy </dev/null

      # BuildKit's `type=gha` cache backend authenticates to the v2 Actions
      # cache service with ACTIONS_RESULTS_URL and ACTIONS_RUNTIME_TOKEN. GitHub
      # injects both into `uses:` steps and into neither `run:` steps nor the job
      # environment, so without this action the `image` recipe below sees no
      # credentials and silently falls back to an uncached build. It has to run
      # before the build step: it publishes the variables through GITHUB_ENV,
      # which only later steps read.
      - name: Expose the Actions cache service to BuildKit
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      # The default `docker` driver does not support every cache export backend,
      # so the lane provisions its own docker-container builder rather than
      # depending on whatever the runner image ships. This makes it current,
      # which is the builder `docker buildx build --load` in the `image` recipe
      # then picks up.
      - name: Set up a cache-capable Docker builder
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Run Alloy Docker tests
        run: just test-alloy-image </dev/null

  alloy-init-test:
    name: Alloy initialization tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'

      - name: Alloy initialization tests
        run: just test-alloy-init </dev/null

  synthetic-monitoring-test:
    name: Synthetic Monitoring tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'

      - name: Set up Go for the shared launcher
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: synthetic_monitoring_shared/launcher/go.mod
          cache: true

      - name: Test the shared launcher
        run: just test-sm </dev/null

      # Same pair as the Alloy lane, and needed for the same reason: the two
      # Actions cache variables reach `uses:` steps only, and the default docker
      # driver cannot export every cache backend. This lane builds two images, so
      # it is the larger of the two cache wins.
      - name: Expose the Actions cache service to BuildKit
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Set up a cache-capable Docker builder
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and smoke-test both complete images
        run: just test-sm-image </dev/null

  init:
    name: Find changed Apps
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # Required by changed-files for pull request diffs.
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
      changed_apps: ${{ steps.filter.outputs.changed_apps }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read changed files
        id: changed_files
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47

      - name: Find App directories
        id: apps
        uses: home-assistant/actions/helpers/find-addons@a7c616ce81ccda50150bf1595786c71b1883fabb # master

      - name: Select changed Apps
        id: filter
        shell: bash
        env:
          APPS: ${{ steps.apps.outputs.addons }}
          CHANGED_FILES: ${{ steps.changed_files.outputs.all_changed_files }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # shellcheck disable=SC2206
          apps=(${APPS})
          changed_apps=()

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]] || \
            [[ "$CHANGED_FILES" =~ \.github/workflows/(builder|build-app)\.yaml ]]; then
            changed_apps=("${apps[@]}")
          else
            for app in "${apps[@]}"; do
              # shellcheck disable=SC2206
              monitored=(${MONITORED_FILES})
              for file in "${monitored[@]}"; do
                if [[ "$CHANGED_FILES" =~ ${app}/${file} ]]; then
                  changed_apps+=("$app")
                  break
                fi
              done
            done
          fi

          if [[ ${#changed_apps[@]} -gt 0 ]]; then
            app_matrix=()
            for app in "${changed_apps[@]}"; do
              publish=false
              if [[ "$EVENT_NAME" == "push" && "$TRIGGER_REF" == "refs/heads/main" ]]; then
                publish=$(python3 scripts/app_version_changed.py "$BASE_SHA" "$HEAD_SHA" "$app")
              fi
              app_matrix+=("$(jq -nc \
                --arg app "$app" \
                --argjson publish "$publish" \
                '{app: $app, publish: $publish}')")
            done
            {
              echo "changed=true"
              echo "changed_apps=$(jq -nc '$ARGS.positional | map(fromjson)' --args "${app_matrix[@]}")"
            } >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build-app:
    name: Build ${{ matrix.app.app }}
    needs: [init, quality, pdc-test, alloy-generator-test, alloy-init-test, synthetic-monitoring-test]
    if: needs.init.outputs.changed == 'true'
    permissions:
      contents: read
      id-token: write # Passed to the reusable workflow for Cosign.
      packages: write # Passed to the reusable workflow for GHCR publication.
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.init.outputs.changed_apps) }}
    uses: ./.github/workflows/build-app.yaml
    with:
      app: ${{ matrix.app.app }}
      publish: ${{ matrix.app.publish }}

  security:
    name: Security and workflow lint
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml

  # The branch ruleset requires only this stable check. Keep all test, build,
  # and security results behind it so matrix names can change without weakening
  # Renovate's merge gate. A skipped build is valid when no App changed.
  ci-success:
    name: ci-success
    needs:
      - init
      - quality
      - pdc-test
      - alloy-generator-test
      - alloy-init-test
      - synthetic-monitoring-test
      - build-app
      - security
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail if any required job did not pass
        if: >-
          ${{
            contains(needs.*.result, 'failure') ||
            contains(needs.*.result, 'cancelled')
          }}
        run: |
          echo "A required job failed or was cancelled: ${{ join(needs.*.result, ', ') }}"
          exit 1

      - name: All required jobs passed
        run: echo "ci-success - ${{ join(needs.*.result, ', ') }}"

  release:
    name: Prepare or publish App releases
    needs:
      - init
      - quality
      - pdc-test
      - alloy-generator-test
      - alloy-init-test
      - synthetic-monitoring-test
      - build-app
      - security
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        needs.init.result == 'success' &&
        needs.quality.result == 'success' &&
        needs.pdc-test.result == 'success' &&
        needs.alloy-generator-test.result == 'success' &&
        needs.alloy-init-test.result == 'success' &&
        needs.synthetic-monitoring-test.result == 'success' &&
        needs.security.result == 'success' &&
        (needs.build-app.result == 'success' || needs.build-app.result == 'skipped')
      }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/release.yaml
    secrets:
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
