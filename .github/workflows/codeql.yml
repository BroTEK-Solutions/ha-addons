# yamllint disable rule:line-length
name: CodeQL
on:
  push:
    branches: [main]
  schedule:
    - cron: '7 2 * * 5'
permissions: {}
jobs:
  codeql:
    permissions:
      security-events: write # uploads CodeQL results
      packages: read # permits analysis of package metadata
      actions: read # reads workflow metadata for Actions analysis
      contents: read # checks out and analyzes repository source
    uses: rknightion/.github/.github/workflows/codeql.yml@2408a41ab6687e377b7988063a6ed2c30b91e61d # v1.32.9
    with:
      languages: '[{"language":"go","build-mode":"autobuild"},{"language":"python","build-mode":"none"},{"language":"javascript-typescript","build-mode":"none"},{"language":"actions","build-mode":"none"}]'
      timeout-minutes: 30
