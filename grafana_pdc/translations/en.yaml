---
configuration:
  signing_token:
    name: Grafana Cloud PDC signing token
    description: >-
      Copy this secret from **Connections > Private data source connections >
      Configuration details** in your Grafana Cloud stack. It authorizes this
      connector to join the PDC network and must include the
      `pdc-signing:write` scope.
  hosted_grafana_id:
    name: Hosted Grafana ID
    description: >-
      Copy the positive numeric **Hosted Grafana ID** from the PDC
      configuration details. This is not your Grafana username, stack URL or
      email address.
  cluster:
    name: Cluster name
    description: >-
      Copy the **Cluster** value exactly from the PDC configuration details.
      It uses lowercase letters, numbers and hyphens; do not infer it from the
      region name.
  allowed_endpoints:
    name: Allowed endpoints
    description: >-
      Optional `host:port` allowlist for destinations Grafana may reach through
      this connector, for example `homeassistant:8123`. **An empty list permits
      every destination reachable from the App network.** Prefer a small,
      explicit list for known data sources.
  log_level:
    name: Log level
    description: >-
      Controls messages written to the App log. Keep **info** for normal use;
      choose **debug** temporarily when diagnosing registration, DNS or tunnel
      problems.
  connections:
    name: Connections
    description: >-
      Number of parallel reverse SSH tunnels to maintain. Default: **1**.
      More connections can improve availability, but the experimental Go SSH
      implementation supports exactly one.
  region_format:
    name: Use region endpoint format
    description: >-
      Changes how the agent derives API and gateway hostnames from the cluster
      and domain. Default: **off**. Enable only when Grafana Cloud configuration
      details or support explicitly requires the regional format.
  domain:
    name: Grafana domain
    description: >-
      Base domain used to derive PDC API and gateway hostnames. Default:
      **grafana.net**. This is redundant when explicit API and gateway FQDNs
      are supplied; change it only for a custom Grafana deployment.
  api_fqdn:
    name: API FQDN override
    description: >-
      Replaces the automatically derived certificate-signing API hostname.
      Leave unset for Grafana Cloud; use a hostname only when Grafana support
      or a private deployment provides one. Do not include `https://`.
  gateway_fqdn:
    name: Gateway FQDN override
    description: >-
      Replaces the automatically derived reverse SSH gateway hostname. Leave
      unset for Grafana Cloud; use a hostname only when Grafana support or a
      private deployment provides one. Do not include a scheme or port.
  cert_expiry_window:
    name: Certificate expiry window
    description: >-
      How early the agent renews its short-lived certificate. Default: **5m**.
      Enter a Go duration such as `5m` or `1h`; change this only for deliberate
      certificate lifecycle tuning.
  cert_check_expiry_period:
    name: Certificate check interval
    description: >-
      How often the agent checks whether its certificate needs renewal.
      Default: **1m**. Enter a duration such as `30s`; use `0` to check only at
      startup.
  retry_max:
    name: Maximum retries
    description: >-
      Maximum retries for failed certificate-signing API requests. Default:
      **4**; accepted range: 0–20. The agent applies its own retry delay.
  parse_metrics:
    name: Parse OpenSSH connection metrics
    description: >-
      Default: **on**. Parses verbose OpenSSH output into PDC Prometheus metrics
      such as connection and forwarding activity on port 8090. Turn this off
      only if parsing causes trouble; it does not disable the metrics server or
      change tunnel logging.
  use_gossh:
    name: Use GoSSH (experimental)
    description: >-
      Replaces the normal OpenSSH subprocess with the agent's experimental Go
      SSH implementation. Default: **off**. It supports one connection and a
      narrower endpoint allowlist syntax; enable only for targeted testing or
      when Grafana support asks.
  connect_timeout_seconds:
    name: Connection timeout
    description: >-
      Maximum time allowed for one SSH connection attempt. Default: **1
      second**; accepted range: 1–600. Increase only for a known slow or
      high-latency network path.
network:
  8090/tcp:
    description: >-
      Unauthenticated Prometheus metrics endpoint (`/metrics`). It is not
      published to the Home Assistant host by default; map a host port only
      when an external scraper needs access and restrict that access yourself.
