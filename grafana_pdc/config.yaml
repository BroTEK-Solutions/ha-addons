name: Grafana Private Data Source Connect
version: 1.0.4
slug: grafana_pdc
description: >-
  Connect a private network data source to Grafana Cloud without exposing it to
  the public internet.
url: https://github.com/BroTEK-Solutions/ha-addons/tree/main/grafana_pdc
image: ghcr.io/brotek-solutions/app-grafana-pdc
arch:
  - aarch64
  - amd64
init: false
ports:
  8090/tcp: null
options:
  allowed_endpoints: []
  log_level: info
schema:
  signing_token: password(1,)
  hosted_grafana_id: match(^[1-9][0-9]*$)
  cluster: match(^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$)
  allowed_endpoints:
    - str(1,)
  log_level: list(debug|info|warn|error)
  connections: int(1,50)?
  region_format: bool?
  domain: >-
    match(^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)*$)?
  api_fqdn: >-
    match(^$|^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)*$)?
  gateway_fqdn: >-
    match(^$|^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)*$)?
  cert_expiry_window: match(^([1-9][0-9]*(\.[0-9]+)?(ms|s|m|h))+$)?
  cert_check_expiry_period: match(^0$|^([1-9][0-9]*(\.[0-9]+)?(ms|s|m|h))+$)?
  retry_max: int(0,20)?
  parse_metrics: bool?
  use_gossh: bool?
  connect_timeout_seconds: int(1,600)?
