name: Grafana Private Data Source Connect
version: 1.1.1
slug: grafana_pdc
description: >-
  Connect a private network data source to Grafana Cloud without exposing it to
  the public internet.
url: https://github.com/BroTEK-Solutions/ha-addons/tree/main/grafana_pdc
image: ghcr.io/brotek-solutions/app-grafana-pdc
arch:
  - aarch64
  - amd64
init: false
# The connector's SSH private key lives in /data/ssh. It is reproducible - the
# agent mints a new keypair and re-registers with the signing token, which is an
# option and so is still captured - and a private key does not belong in a
# backup archive that is frequently unencrypted and copied off the device.
backup_exclude:
  - ssh/**
# Optional: when Home Assistant has an MQTT broker, the App publishes its own
# health as entities so automations can react to a broken telemetry pipeline.
# "want" rather than "need" - the App runs perfectly well without a broker. This
# grants only the MQTT service; it deliberately does not add hassio_api.
services:
  - mqtt:want
ports:
  8090/tcp: null
options:
  allowed_endpoints: []
  log_level: info
schema:
  signing_token: password(1,)
  hosted_grafana_id: match(^[1-9][0-9]*$)
  cluster: match(^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$)
  allowed_endpoints:
    - str(1,)
  log_level: list(debug|info|warn|error)
  connections: int(1,50)?
  region_format: bool?
  domain: >-
    match(^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)*$)?
  api_fqdn: >-
    match(^$|^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)*$)?
  gateway_fqdn: >-
    match(^$|^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)*$)?
  cert_expiry_window: match(^([1-9][0-9]*(\.[0-9]+)?(ms|s|m|h))+$)?
  cert_check_expiry_period: match(^0$|^([1-9][0-9]*(\.[0-9]+)?(ms|s|m|h))+$)?
  retry_max: int(0,20)?
  parse_metrics: bool?
  use_gossh: bool?
  connect_timeout_seconds: int(1,600)?
