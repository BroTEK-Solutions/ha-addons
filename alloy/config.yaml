    (?:[0-9A-Fa-f]{1,4}:){4}:(?:[0-9A-Fa-f]{1,4}:)?| (?:[0-9A-Fa-f]{1,4}:){5}:)
    (?:0|[1-9]\d?|1\d{2}|2[0-4]\d|25[0-5])
    (?:\.(?:0|[1-9]\d?|1\d{2}|2[0-4]\d|25[0-5])){3} )
    (?:%25(?:[A-Za-z0-9._~-]|%[0-9A-Fa-f]{2})+)?\]| [A-Za-z0-9._-]+ )
    (?::(?:[1-9]\d{0,3}|[1-5]\d{4}|6[0-4]\d{3}|65[0-4]\d{2}|655[0-2]\d|6553[0-5]))?
    (?:[/?#](?:[^%\s"\\]|%[0-9A-Fa-f]{2})*)?$ )?
  tempo_username: match(^$|^[^"\\\x00-\x1F\x7F]+$)?
  tempo_password: password?
  traces_enabled: bool
  traces_network_access: bool
  pyroscope_url: >-
    match((?x) ^$|^https?:// (?: \[(?: (?:[0-9A-Fa-f]{1,4}:){7}[0-9A-Fa-f]{1,4}|
    (?:[0-9A-Fa-f]{1,4}:){1,7}:| (?:[0-9A-Fa-f]{1,4}:){1,6}:[0-9A-Fa-f]{1,4}|
    (?:[0-9A-Fa-f]{1,4}:){1,5}(?::[0-9A-Fa-f]{1,4}){1,2}|
