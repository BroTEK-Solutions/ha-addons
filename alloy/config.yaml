name: Grafana Alloy
version: 2.3.0
slug: alloy
description: >-
  Ship Home Assistant OS logs, metrics, traces and profiles with Grafana Alloy,
  configured through a guided ingress web interface.
url: https://github.com/BroTEK-Solutions/ha-addons
image: ghcr.io/brotek-solutions/app-alloy
arch:
  - aarch64
  - amd64
init: false
startup: services
journald: true
host_network: true
homeassistant_api: true
# Optional: when Home Assistant has an MQTT broker, the App publishes its own
# health as entities so automations can react to a broken telemetry pipeline.
# "want" rather than "need" - the App runs perfectly well without a broker.
services:
  - mqtt:want
ingress: true
ingress_stream: true
hassio_api: true
map:
  - type: share
    read_only: true
  - type: media
    read_only: true
  - type: backup
    read_only: true
backup_exclude:
  - alloy/**
options:
  safe_mode: false
  ui_log_level: info
  alloy_stability_level: generally-available
schema:
  safe_mode: bool
  ui_log_level: list(debug|info|warn|error)
  alloy_stability_level: list(generally-available|public-preview|experimental)
stage: stable
