name: Grafana Alloy
version: "1.5.1"
slug: alloy
description: >-
  Ship Home Assistant OS logs to Loki and host system metrics to Prometheus
  using Grafana Alloy, optionally managed from Grafana Fleet Management.
  Replacement for the deprecated Promtail add-on, plus node_exporter-style
  host monitoring (CPU, memory, disk, network).
url: https://github.com/BroTEK-Solutions/ha-addons
image: ghcr.io/brotek-solutions/{arch}-addon-alloy
codeowners:
  - "@rknightion"
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
journald: true
host_network: true
map:
  - addon_config:rw
  - share
  - media
  - backup
ports:
  12345/tcp: 12345
ports_description:
  12345/tcp: "Alloy debug UI"
watchdog: "http://[HOST]:[PORT:12345]/-/ready"
options:
  loki_url: "http://localhost:3100/loki/api/v1/push"
  instance_name: homeassistant
  metrics_scrape_interval: 60s
  fleet_poll_frequency: 5m
  log_level: info
schema:
  loki_url: "url?"
  loki_username: "str?"
  loki_password: "password?"
  prometheus_url: "url?"
  prometheus_username: "str?"
  prometheus_password: "password?"
  instance_name: "str?"
  metrics_scrape_interval: "str?"
  fleet_url: "url?"
  fleet_username: "str?"
  fleet_password: "password?"
  fleet_collector_name: "str?"
  fleet_attributes: "str?"
  fleet_poll_frequency: "str?"
  log_level: "list(debug|info|warn|error)"
  additional_config: "str?"
stage: experimental
apparmor: false
