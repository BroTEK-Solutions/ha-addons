name: Grafana Alloy
version: "1.4.0"
slug: alloy
description: >-
  Ship Home Assistant OS logs to Loki and host system metrics to Prometheus
  using Grafana Alloy. Replacement for the deprecated Promtail add-on, plus
  node_exporter-style host monitoring (CPU, memory, disk, network).
url: https://github.com/rknightion/ha-addon-alloy
image: ghcr.io/rknightion/{arch}-addon-alloy
codeowners:
  - "@rknightion"
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
journald: true
host_network: true
map:
  - addon_config:rw
  - share
  - media
  - backup
ports:
  12345/tcp: 12345
ports_description:
  12345/tcp: "Alloy debug UI"
watchdog: "http://[HOST]:[PORT:12345]/-/ready"
options:
  loki_url: "http://localhost:3100/loki/api/v1/push"
  instance_name: homeassistant
  metrics_scrape_interval: 60s
  log_level: info
schema:
  loki_url: "url?"
  loki_username: "str?"
  loki_password: "password?"
  prometheus_url: "url?"
  prometheus_username: "str?"
  prometheus_password: "password?"
  instance_name: "str?"
  metrics_scrape_interval: "str?"
  log_level: "list(debug|info|warn|error)"
  additional_config: "str?"
stage: experimental
apparmor: false
