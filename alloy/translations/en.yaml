---
configuration:
  operation_mode:
    name: Operation mode
    description: >-
      Choose **Fleet Management** to run configuration supplied by Grafana
      Cloud, or **Local configuration** to build monitoring pipelines here.
  loki_url:
    name: Loki push endpoint
    description: >-
      Full URL of your Loki push API, for example
      http://192.168.1.45:3100/loki/api/v1/push. Leave empty to disable log
      shipping. Local mode needs at least one Loki, Prometheus, Tempo or
      Pyroscope destination.
  loki_username:
    name: Loki username
    description: >-
      Username for HTTP basic auth against Loki. On Grafana Cloud this is the
      numeric Loki instance ID, not your email address. Set this and the
      password together, or neither.
  loki_password:
    name: Loki password
    description: >-
      Password or access-policy token for Loki. Passed to Alloy through an
      environment variable, so it is never written into the generated config.
  logs_system:
    name: Collect HAOS system logs
    description: Collect journal entries from Home Assistant OS services outside containers.
  logs_homeassistant:
    name: Collect Home Assistant Core logs
    description: Collect logs from the Home Assistant Core container.
  logs_addons:
    name: Collect App logs
    description: Collect logs from other Home Assistant Apps recorded in the system journal.
  logs_exclude_addons:
    name: Excluded Apps
    description: Comma-separated App container names to omit. Alloy excludes itself by default.
  logs_max_age:
    name: Journal replay age
    description: Oldest journal entries read on first start, as a duration such as **24h**.
  prometheus_url:
    name: Prometheus remote write endpoint
    description: >-
      Full URL of a Prometheus or Mimir remote_write endpoint, for example
      http://192.168.1.45:9090/api/v1/write. Leave empty to disable every local
      metric pipeline.
  prometheus_username:
    name: Prometheus username
    description: >-
      Username for HTTP basic auth against Prometheus. On Grafana Cloud this is
      the numeric metrics instance ID. Set this and the password together, or
      neither.
  prometheus_password:
    name: Prometheus password
    description: >-
      Password or access-policy token for Prometheus. Passed to Alloy through
      an environment variable, so it is never written into the generated config.
  instance_name:
    name: Instance name
    description: >-
      Identifies this machine. Used as the instance label on every metric and
      as the collector ID reported to Fleet Management.
  metrics_scrape_interval:
    name: Metrics scrape interval
    description: >-
      How often host metrics are collected, as a duration such as 30s, 60s or
      5m. Only applies when a Prometheus endpoint is set.
  host_metrics:
    name: Collect host metrics
    description: >-
      Collect CPU, memory, disk, load and network metrics for the machine
      running Home Assistant, using Alloy's unix exporter. Requires a Prometheus
      endpoint.
  homeassistant_metrics:
    name: Collect Home Assistant metrics
    description: >-
      Scrape Home Assistant Core's own Prometheus endpoint, which exposes entity
      states and Core internals. Requires a Prometheus endpoint here and the
      prometheus integration enabled in Home Assistant, otherwise the scrape
      returns 404.
  alloy_metrics:
    name: Collect Alloy self-monitoring metrics
    description: Scrape Alloy's own Prometheus metrics and send them to the configured metrics destination.
  tempo_url:
    name: Tempo OTLP HTTP endpoint
    description: Full OTLP HTTP endpoint used to forward traces. Leave empty when traces are disabled.
  tempo_username:
    name: Tempo tenant or username
    description: Optional basic-auth username or Grafana Cloud Tempo tenant ID.
  tempo_password:
    name: Tempo token
    description: Optional password or access-policy token paired with the Tempo username.
  traces_enabled:
    name: Receive and forward OTLP traces
    description: Accept OTLP over HTTP and gRPC and forward traces to the Tempo endpoint.
  traces_network_access:
    name: Allow OTLP clients on the HAOS network
    description: >-
      By default the OTLP receivers listen only inside this App. Enable this to
      bind gRPC 4317 and HTTP 4318 to every HAOS network interface. Use only on
      a trusted network and restrict access with your firewall.
  pyroscope_url:
    name: Pyroscope endpoint
    description: Full Pyroscope push endpoint used for continuous profiles.
  pyroscope_username:
    name: Pyroscope tenant or username
    description: Optional basic-auth username or Grafana Cloud profiles tenant ID.
  pyroscope_password:
    name: Pyroscope token
    description: Optional password or access-policy token paired with the Pyroscope username.
  alloy_profiling:
    name: Profile Alloy itself
    description: Continuously profile this Alloy process and send profiles to Pyroscope.
  fleet_url:
    name: Fleet Management URL
    description: >-
      Grafana Fleet Management service URL, for example
      https://fleet-management-prod-001.grafana.net. Copy it from the API tab
      of the Fleet Management page rather than typing it by hand, as some
      regions use a longer hostname. Fleet mode runs the pipelines it receives
      and does not generate local pipelines.
  fleet_username:
    name: Fleet Management username
    description: >-
      Numeric instance ID from the Fleet Management API tab. Fleet mode
      requires this together with the URL and Grafana Cloud read/write API key.
  gcloud_rw_api_key:
    name: Grafana Cloud read/write API key
    description: >-
      Token used to authenticate Fleet Management and exported as
      `GCLOUD_RW_API_KEY` for remotely supplied pipelines.
  fleet_password:
    name: Legacy Fleet Management token
    description: >-
      Upgrade-only name used by older App versions. Do not configure this for a
      new installation; use the Grafana Cloud read/write API key field instead.
  fleet_collector_name:
    name: Fleet Management collector name
    description: >-
      Human-readable name for this collector in the Fleet Management UI, for
      example Home Assistant. Optional.
  fleet_attributes:
    name: Fleet Management attributes
    description: >-
      Comma-separated key=value pairs, for example env=home,role=hass. Fleet
      Management matches these against your pipelines to decide which ones this
      collector receives.
  fleet_poll_frequency:
    name: Fleet Management poll frequency
    description: >-
      How often to check Fleet Management for configuration updates, as a
      duration. Default: **1m**. Alloy requires at least 10s.
  log_level:
    name: Log level
    description: >-
      Verbosity of Alloy's own logging in the add-on log. This does not affect
      which journal entries are shipped, only how much Alloy says about itself.
  alloy_stability_level:
    name: Alloy stability level
    description: >-
      The lowest component stability Alloy will load. Raise it to
      public-preview or experimental only if a component you need in
      additional_config requires it - Alloy refuses to start otherwise.
  alloy_disable_telemetry:
    name: Disable Alloy usage reporting
    description: >-
      Alloy reports anonymous usage statistics to Grafana by default. Leave this
      enabled (the App default) to pass `--disable-reporting` and send nothing.
  alloy_additional_args:
    name: Additional Alloy startup flags
    description: >-
      Extra command-line flags for Alloy, separated by spaces, for example
      --server.http.enable-pprof=false. Advanced use only; a bad flag stops the
      add-on from starting.
  additional_config:
    name: Additional Alloy configuration
    description: >-
      Extra Alloy configuration blocks, appended verbatim to the generated
      config. Advanced use only, and a syntax error here stops the add-on from
      starting.
