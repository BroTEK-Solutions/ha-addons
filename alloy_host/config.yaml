name: Grafana Alloy with Host Processes
version: 1.0.0 # x-release-please-version
slug: alloy_host
description: >-
  Grafana Alloy that can also see every process on the Home Assistant OS
  host when you turn its protection mode off, for per-process metrics.
url: https://github.com/BroTEK-Solutions/ha-addons
